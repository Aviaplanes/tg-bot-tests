[workspace]
members = ["crates/tg-lab-core", "crates/tg-lab-bot"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
tg-lab-core = { path = "crates/tg-lab-core" }

anyhow = "1"
async-trait = "0.1"
dotenvy = "0.15"
dptree = "0.5.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { package = "teloxide-fork", version = "0.18.0", features = ["macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
